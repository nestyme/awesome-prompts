<svg xmlns="http://www.w3.org/2000/svg" width="1350" height="1350" viewBox="0 0 1350 1350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1350" height="1350" fill="#FBFBF9"/>
  <g fill="#111111">
    <text x="140" y="170" font-size="24" fill="#8C8C8C">a creator replies</text>
    <text x="140" y="260" font-size="76" font-weight="500" letter-spacing="-1">“$500 per video”</text>

    <line x1="140" y1="326" x2="1210" y2="326" stroke="#E3E3E0" stroke-width="2"/>

    <text x="140" y="400" font-size="24" fill="#8C8C8C">what the video is worth to us</text>
    <text x="140" y="462" font-size="34">views ≈ their median ÷ 3</text>
    <text x="140" y="514" font-size="34"><tspan fill="#2E5FD0" font-weight="500">worth</tspan> = views × share from buying countries × $ per view</text>

    <line x1="140" y1="580" x2="1210" y2="580" stroke="#E3E3E0" stroke-width="2"/>

    <text x="140" y="654" font-size="24" fill="#8C8C8C"><tspan fill="#2E5FD0">worth</tspan> ÷ ask</text>

    <rect x="140" y="686" width="8" height="42" rx="2" fill="#2F8F5B"/>
    <text x="170" y="718" font-size="34" font-weight="500" fill="#2F8F5B">1+</text>
    <text x="440" y="718" font-size="34" fill="#2F8F5B">yes, pay their price</text>

    <rect x="140" y="742" width="8" height="42" rx="2" fill="#B57A12"/>
    <text x="170" y="774" font-size="34" font-weight="500" fill="#B57A12">0.6–1</text>
    <text x="440" y="774" font-size="34" fill="#B57A12">counter with your max</text>

    <rect x="140" y="798" width="8" height="42" rx="2" fill="#D0661F"/>
    <text x="170" y="830" font-size="34" font-weight="500" fill="#D0661F">0.33–0.6</text>
    <text x="440" y="830" font-size="34" fill="#D0661F">your max for fewer videos</text>

    <rect x="140" y="854" width="8" height="42" rx="2" fill="#C8472E"/>
    <text x="170" y="886" font-size="34" font-weight="500" fill="#C8472E">under 0.33</text>
    <text x="440" y="886" font-size="34" fill="#C8472E">say no kindly, write again later</text>

    <text x="170" y="942" font-size="34" fill="#8C8C8C">own package</text>
    <text x="440" y="942" font-size="34" fill="#8C8C8C">take it</text>

    <line x1="140" y1="1006" x2="1210" y2="1006" stroke="#E3E3E0" stroke-width="2"/>

    <text x="140" y="1080" font-size="24" fill="#8C8C8C">log every price</text>
    <text x="140" y="1142" font-size="34">creator → thread → <tspan fill="#2E5FD0" font-weight="500">price</tspan> → deal → <tspan fill="#2F8F5B" font-weight="500">payers</tspan></text>
    <text x="140" y="1194" font-size="34" fill="#8C8C8C"><tspan fill="#2F8F5B">payers</tspan> move the thresholds</text>

    <text x="140" y="1280" font-size="20" fill="#B0B0AC">@nestymee</text>
    <text x="1210" y="1280" font-size="20" fill="#B0B0AC" text-anchor="end">awesome-prompts / creator-negotiation</text>
  </g>
</svg>
